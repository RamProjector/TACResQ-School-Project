services:
  api:
    build: .
    ports:
      - "8000:10000"
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: tacresq
      DB_USERNAME: tacresq
      DB_PASSWORD: tacresq
      SESSION_DRIVER: file
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tacresq
      POSTGRES_USER: tacresq
      POSTGRES_PASSWORD: tacresq
    ports:
      - "5432:5432"
    volumes:
      - tacresq-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacresq -d tacresq"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  tacresq-db:
