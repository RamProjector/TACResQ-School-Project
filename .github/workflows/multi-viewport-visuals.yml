name: Multi-viewport visual checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-prototype-screenshots:
    name: Responsive prototype screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture and validate five viewport sizes
        run: python3 tools/test_multi_viewport_visuals.py

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tacresq-multi-viewport-screenshots
          path: artifacts/visual/multi-viewport/
          if-no-files-found: warn
          retention-days: 14
