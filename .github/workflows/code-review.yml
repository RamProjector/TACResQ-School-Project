name: TACResQ Automated Code Review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Existing pull request number to review
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
  issues: write
concurrency:
  group: tacresq-review-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true
jobs:
  automated-review:
    name: Static security and correctness review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted base branch only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Review pull request diff and publish findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: python3 tools/tacresq_code_reviewer.py
