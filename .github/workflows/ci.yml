name: TACResQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Test TACResQ automated code reviewer
        run: python3 tools/test_tacresq_code_reviewer.py

      - name: Run offline dispatcher workflow test
        run: python3 tools/test_workflow.py

      - name: Check inline authentication validation
        run: python3 tools/test_auth_inline_validation.py

      - name: Test bounded stress utility without Docker
        run: python3 tools/test_stress_test.py

      - name: Check encrypted Android session storage contract
        run: python3 tools/test_android_session_security.py

      - name: Test bounded Docker Compose retry helper
        run: python3 tools/test_docker_compose_retry.py

      - name: Check incident report authorization contract
        run: python3 tools/test_incident_authorization.py
      - name: Check durable SOS idempotency contract
        run: python3 tools/test_durable_sos_idempotency.py

      - name: Check requester active-incident and cancellation contract
        run: python3 tools/test_requester_active_incident.py

      - name: Check dispatcher multi-responder assignment
        run: python3 tools/test_dispatch_team_assignment.py
      - name: Check dispatcher queue wait-time prioritization
        run: python3 tools/test_dispatcher_wait_time_queue.py

      - name: Check per-responder assignment status contract
        run: python3 tools/test_per_responder_assignment_status.py

      - name: Check urgent location correction cooldown bypass
        run: python3 tools/test_requester_urgent_location_correction.py

      - name: Check responder-location SQL contract
        run: python3 tools/test_location_contract.py

      - name: Check manual SOS pin provenance and requester UI
        run: python3 tools/test_manual_location_source.py
      - name: Check Supabase migration history alignment
        run: python3 tools/test_migration_history_alignment.py

      - name: Check GPS location-disabled regression
        run: python3 tools/test_location_disabled_regression.py

      - name: Check osmdroid tile cache configuration
        run: python3 tools/test_osmdroid_tile_cache.py

      - name: Check GPS map empty-state messaging
        run: python3 tools/test_gps_map_empty_state.py

      - name: Check full-screen GPS map viewport
        run: python3 tools/test_gps_map_fullscreen.py

      - name: Check five-destination navigation labels
        run: python3 tools/test_bottom_navigation_labels.py

      - name: Check map network-state permission
        run: python3 tools/test_map_network_permissions.py

      - name: Check GPS map offline connection status
        run: python3 tools/test_gps_map_network_status.py

      - name: Check GPS map foreground-only polling
        run: python3 tools/test_gps_map_lifecycle_polling.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Check location RPC search-path contract
        run: python3 tools/test_location_rpc_search_path.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: backend/web/pnpm-lock.yaml

      - name: Check SECURITY DEFINER trigger search paths
        run: python3 tools/test_trigger_search_paths.py

      - name: Install dashboard dependencies
        working-directory: backend/web
        run: pnpm install --frozen-lockfile

      - name: Type-check and build dashboard for /dispatch/
        working-directory: backend/web
        env:
          VITE_BASE_PATH: /dispatch/
        run: pnpm build

      - name: Check RPC and table privilege grants
        run: python3 tools/test_rpc_grants.py

      - name: Check Render startup migration safety
        run: python3 tools/test_render_startup_migrations.py

  android-builds:
    name: Android debug and release builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Android app and Gradle wrapper
        run: python3 tools/check_android_source.py

      - name: Check demo and Supabase build-mode separation
        run: python3 tools/test_android_build_modes.py


      - name: Accept Android SDK licenses and install API 37
        if: hashFiles('gradlew') != ''
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v6

      - name: Configure optional release signing
        id: release-signing
        if: hashFiles('gradlew') != ''
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
        run: |
          values="${ANDROID_SIGNING_KEYSTORE_BASE64:+1}${ANDROID_SIGNING_KEY_ALIAS:+1}${ANDROID_SIGNING_KEY_PASSWORD:+1}${ANDROID_SIGNING_STORE_PASSWORD:+1}"
          if [ -z "$values" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; the release APK will be unsigned."
            exit 0
          fi
          if [ "${#values}" -ne 4 ]; then
            echo "::error::Configure all four Android signing secrets together, or leave all four unset."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tacresq-signing"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tacresq-signing/release.jks"
          test -s "$RUNNER_TEMP/tacresq-signing/release.jks"
          echo "ANDROID_SIGNING_STORE_FILE=$RUNNER_TEMP/tacresq-signing/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build demo-mode debug APK
        if: hashFiles('gradlew') != ''
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p artifacts/android
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/android/tacresq-demo-debug.apk

      - name: Run Android JVM unit tests
        if: hashFiles('gradlew') != ''
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build Supabase-mode debug APK
        if: hashFiles('gradlew') != ''
        run: |
          ./gradlew --no-daemon assembleDebug -PuseSupabase=true
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/android/tacresq-supabase-debug.apk

      - name: Build release APK
        if: hashFiles('gradlew') != ''
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signed release APK when signing is configured
        if: hashFiles('gradlew') != '' && steps.release-signing.outputs.configured == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Collect release APK
        if: hashFiles('gradlew') != ''
        run: |
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$RELEASE_APK" ]; then
            RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          test -s "$RELEASE_APK"
          cp "$RELEASE_APK" artifacts/android/tacresq-release.apk

      - name: Upload Android APKs
        if: hashFiles('gradlew') != ''
        uses: actions/upload-artifact@v7
        with:
          name: tacresq-android-apks
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain missing Gradle build
        if: hashFiles('gradlew') == ''
        run: echo 'No Gradle wrapper is checked in; Android source-contract validation ran instead of APK builds.'

  prototype-browser-checks:
    name: Prototype navigation, functions, and visual screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip playwright pillow
          python -m playwright install --with-deps chromium

      - name: Test navigation and user functions
        run: python3 tools/test_prototype.py

      - name: Compare visual screenshots
        run: python3 tools/visual_regression.py

      - name: Capture and validate multiple viewport sizes
        run: python3 tools/test_multi_viewport_visuals.py

      - name: Upload visual report and changed screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tacresq-visual-regression
          path: artifacts/visual/
          if-no-files-found: error

  backend-integration:
    name: Laravel and dashboard integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: source-checks
    env:
      SUPABASE_URL: https://tacresq-ci.example.test
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Generate an ephemeral Laravel test key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Write disposable Compose environment
        working-directory: backend
        run: |
          printf 'APP_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$APP_KEY" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env

      - name: Build and start the Laravel/Postgres stack
        working-directory: backend
        run: bash ../tools/docker_compose_retry.sh

      - name: Wait for Laravel readiness
        working-directory: backend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/up >/dev/null; then
              echo "Laravel is ready."
              exit 0
            fi
            sleep 2
          done
          docker compose logs api db
          exit 1

      - name: Verify Supabase settings reach the API container
        working-directory: backend
        run: |
          docker compose exec -T api sh -ec '
            test "$SUPABASE_URL" = "https://tacresq-ci.example.test"
            test "$SUPABASE_PUBLISHABLE_KEY" = "sb_publishable_ci_placeholder"
          '

      - name: Verify PostgreSQL migrations on the real integration database
        working-directory: backend
        run: |
          docker compose exec -T api php artisan migrate --force
          docker compose exec -T api php artisan migrate:status --database=pgsql

      - name: Run Laravel feature tests
        working-directory: backend
        run: docker compose exec -T api php artisan test

      - name: Verify dashboard document and static assets
        working-directory: backend
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/dispatch/ --output /tmp/dispatch.html
          curl --fail --silent --show-error http://127.0.0.1:8000/dispatch/tacru-mark.svg --output /dev/null
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path('/tmp/dispatch.html').read_text()
          source = Path('web/index.html').read_text()
          title_match = re.search(r'<title>.*?</title>', source)
          assert title_match, 'Dashboard title missing from source index'
          expected_title = title_match.group(0)
          print(f'Expected dashboard title from source: {expected_title}')
          assert expected_title in html, f'Served dashboard title differs from source: {expected_title}'
          assert '/dispatch/assets/' in html, 'Dashboard asset base path missing'
          print('Dashboard document and logo were served successfully.')
          PY

      - name: Verify runtime configuration endpoint
        working-directory: backend
        run: |
          curl --fail --silent --show-error --dump-header /tmp/config-headers.txt \
            http://127.0.0.1:8000/runtime-config.json --output /tmp/dispatch-config.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('/tmp/dispatch-config.json').read_text())
          headers = Path('/tmp/config-headers.txt').read_text().lower().replace('\r', '')
          expected = {
              'supabaseUrl': 'https://tacresq-ci.example.test',
              'supabasePublishableKey': 'sb_publishable_ci_placeholder',
          }
          assert config == expected, 'Runtime config does not match CI environment'
          assert 'cache-control: no-store, private' in headers, 'Cache-Control must disable storage'
          print('Runtime configuration is correct and non-cacheable.')
          PY

      - name: Capture Laravel logs on integration failure
        if: failure()
        working-directory: backend
        run: docker compose logs --no-color api db || true

      - name: Stop test services
        if: always()
        working-directory: backend
        run: |
          docker compose down --volumes --remove-orphans || true
          rm -f .env

  supabase-migration-replay:
    name: Replay Supabase migrations on clean PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: source-checks
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tacresq_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tacresq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tacresq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Replay every migration on a clean database
        run: bash tools/test_supabase_migration_replay.sh
