name: RPC grant contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-grant-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tacresq_test
    services:
      postgres:
        image: postgres:17.12-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tacresq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tacresq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Verify anonymous RPC grants are restricted
        run: python3 tools/test_rpc_grants.py
      - name: Verify account lifecycle foundation contract
        run: python3 tools/test_account_lifecycle_foundation.py
      - name: Replay migrations and verify existing database contracts
        run: bash tools/test_supabase_migration_replay.sh
      - name: Verify incident assignment table privileges
        run: psql -v ON_ERROR_STOP=1 -f tools/test_incident_assignment_privileges.sql
      - name: Verify operational table write boundaries
        run: psql -v ON_ERROR_STOP=1 -f tools/test_operational_table_privileges.sql
      - name: Verify core table destructive privilege boundaries
        run: psql -v ON_ERROR_STOP=1 -f tools/test_core_table_privileges.sql
      - name: Verify backend-only device registry privileges
        run: psql -v ON_ERROR_STOP=1 -f tools/test_device_security_privileges.sql
      - name: Verify GPS RPC privileges and authorization at runtime
        run: psql -v ON_ERROR_STOP=1 -f tools/test_location_rpc_security.sql
