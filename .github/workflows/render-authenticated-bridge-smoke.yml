name: TACResQ authenticated Render bridge smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tacresq-authenticated-bridge-smoke
  cancel-in-progress: false

jobs:
  requester:
    name: Verify requester account
    uses: ./.github/workflows/render-authenticated-bridge-smoke-role.yml
    with:
      expected_role: requester
    secrets:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      TEST_EMAIL: ${{ secrets.SUPABASE_REQUESTER_TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}

  responder:
    name: Verify responder account
    uses: ./.github/workflows/render-authenticated-bridge-smoke-role.yml
    with:
      expected_role: responder
    secrets:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      TEST_EMAIL: ${{ secrets.SUPABASE_RESPONDER_TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}

  driver:
    name: Verify driver account
    uses: ./.github/workflows/render-authenticated-bridge-smoke-role.yml
    with:
      expected_role: driver
    secrets:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      TEST_EMAIL: ${{ secrets.SUPABASE_DRIVER_TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}

  dispatcher:
    name: Verify dispatcher account
    uses: ./.github/workflows/render-authenticated-bridge-smoke-role.yml
    with:
      expected_role: dispatcher
    secrets:
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      TEST_EMAIL: ${{ secrets.SUPABASE_DISPATCHER_TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.SUPABASE_TEST_PASSWORD }}
