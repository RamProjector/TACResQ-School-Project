name: TACResQ Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: tacresq-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-guardrails:
    name: Repository security guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run deterministic repository security guardrails
        run: python3 tools/ai_security_review.py

      - name: Review dependency changes on pull requests
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5

  codeql-android:
    name: CodeQL Android (Java and Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java for Android CodeQL extraction
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages for CodeQL build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Initialize CodeQL for Android
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Android source for CodeQL
        run: ./gradlew --no-daemon assembleDebug

      - name: Analyze Android source with CodeQL
        uses: github/codeql-action/analyze@v4

  codeql-web-actions:
    name: CodeQL Web and GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Initialize CodeQL for interpreted languages
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          build-mode: none

      - name: Analyze web and workflow source with CodeQL
        uses: github/codeql-action/analyze@v4
