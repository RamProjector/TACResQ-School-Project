name: TACResQ Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 1"

permissions:
  contents: read
  security-events: write
  pull-requests: read

concurrency:
  group: tacresq-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Static and dependency security review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run deterministic repository security guardrails
        run: python3 tools/ai_security_review.py

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin, javascript-typescript, actions

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4

      - name: Review dependency changes on pull requests
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
