name: Local Supabase migration compatibility (advisory)

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "docs/QA_LOCAL_SUPABASE_CLI_COMPATIBILITY_SPIKE.md"
      - ".github/workflows/local-supabase-migration-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-supabase-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-supabase-migration-replay:
    name: Full local Supabase migration replay (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@a9de0f0e1ffcf6ec895b135e292ddc76592d3c83 # v3
        with:
          version: 3.4.0

      - name: Initialize and validate disposable local project
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          set -euo pipefail
          # This workflow has no repository or environment secrets. Explicitly
          # clear any runner-provided Supabase targeting variables as defense in depth.
          unset SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF || true
          test ! -e supabase/config.toml
          test ! -e supabase/config.json
          test ! -e supabase/config.jsonc
          supabase --version
          supabase init
          test -f supabase/config.jsonc
          supabase config validate

      - name: Start isolated Supabase services and replay all migrations
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
        run: |
          set -euo pipefail
          # No supabase link or remote flags are used. Startup output is filtered
          # so generated local JWT keys are never printed into Actions logs.
          if ! supabase start 2>&1 | sed -E \
            -e 's/(service_role key:|anon key:|JWT secret:).*/\1 [REDACTED]/I' \
            -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[REDACTED_JWT]/g'; then
            echo "Local Supabase startup or migration application failed."
            exit 1
          fi
          supabase db reset --local
          echo "Local Supabase migration replay completed."

      - name: Stop local stack and delete its volumes
        if: always()
        run: |
          if [ -f supabase/config.jsonc ]; then
            supabase stop --no-backup || true
          fi
