name: TACResQ quality assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stress_requests:
        description: Total safe GET requests for the local stack
        required: false
        default: "120"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  security:
    name: CodeQL Android (Java and Kotlin)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java for Android CodeQL extraction
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages for CodeQL build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;36.0.0"

      - name: Initialize CodeQL for Android
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Report resolved Android runtime dependencies
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath

      - name: Report resolved Gradle plugin dependencies
        run: ./gradlew --no-daemon buildEnvironment

      - name: Build Android source for CodeQL
        run: ./gradlew --no-daemon --no-build-cache clean assembleDebug

      - name: Analyze Android source with CodeQL
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4

  screen-capture:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: Capture every prototype screen and activity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture all activated screen and state flows
        run: python3 tools/capture_wireframe_screenshots.py --output artifacts/screenshots
      - name: Upload screenshot gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tacresq-screen-gallery
          path: artifacts/screenshots
          if-no-files-found: error

  stress:
    # Run the bounded, disposable local-stack smoke test on every PR as well as scheduled/manual QA.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    name: Local stack stress smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate disposable Laravel key
        run: echo "APP_KEY=base64:$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: Start local API and dashboard
        working-directory: backend
        env:
          SUPABASE_URL: https://tacresq-ci.example.test
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          printf 'APP_KEY=%s\nSUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$APP_KEY" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env
          docker compose up -d --build
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:8000/up >/dev/null && exit 0; sleep 2; done
          docker compose logs api db
          exit 1
      - name: Run bounded GET stress test
        env:
          STRESS_REQUESTS: ${{ inputs.stress_requests || '120' }}
        run: python3 tools/stress_test.py --base-url http://127.0.0.1:8000 --allow-localhost --requests "$STRESS_REQUESTS" --concurrency 8
      - name: Collect logs and stop stack
        if: always()
        working-directory: backend
        run: |
          docker compose logs --no-color > ../artifacts-stress.log || true
          docker compose down --volumes --remove-orphans || true
          rm -f .env
      - name: Upload stress logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tacresq-stress-logs
          path: artifacts-stress.log
          if-no-files-found: ignore
