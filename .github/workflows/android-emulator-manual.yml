name: Manual Android Emulator UI Smoke Tests

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional reason for running the emulator smoke tests"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tacresq-manual-android-emulator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-emulator-smoke:
    name: Advisory Android emulator/UI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Enable KVM permissions for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "::warning::/dev/kvm unavailable; emulator startup may be slower or time out."
          fi

      - name: Preinstall Android 36 emulator image with bounded retry
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          for attempt in 1 2 3; do
            echo "Installing Android 36 Google APIs x86_64 system image (attempt $attempt/3)."
            if "$SDKMANAGER" --install "system-images;android-36;google_apis;x86_64"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "::error::Android emulator image installation failed after 3 attempts."
          exit 1

      - name: Run Android instrumented smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # Use the stable API 36 emulator image; the app compile SDK package is android-37.0.
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          pre-emulator-launch-script: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
          script: ./gradlew --no-daemon connectedDebugAndroidTest
